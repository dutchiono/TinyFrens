# Public website. Install after obtaining the tinyfrens.lol certificate.
server {
    listen 80;
    listen [::]:80;
    server_name tinyfrens.lol www.tinyfrens.lol;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tinyfrens.lol www.tinyfrens.lol;
    ssl_certificate /etc/letsencrypt/live/tinyfrens.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tinyfrens.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tinyfrens/current;
    index index.html;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, X-Snap-Payload" always;
    add_header Vary "Accept" always;
    add_header Link '<https://www.tinyfrens.lol/snap>; rel="alternate"; type="application/vnd.farcaster.snap+json"' always;

    location = / {
        error_page 418 = @snap;
        if ($http_accept ~* "application/vnd\.farcaster\.snap\+json") { return 418; }
        try_files /index.html =404;
    }
    location @snap {
        rewrite ^ /api/snap break;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host tinyfrens.miono.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Vary;
        proxy_hide_header Link;
    }
    location = /snap { rewrite ^ /api/snap last; }
    location = /api/snap { rewrite ^ /api/snap/ last; }
    location ^~ /api/snap/ {
        # Preserve /api/snap and its interaction subpaths on the relay.
        rewrite ^/api/snap/$ /api/snap break;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host tinyfrens.miono.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Vary;
        proxy_hide_header Link;
    }
    location = /skill.md { return 301 /import/skill.md; }
    location = /web/robot-preview.html { return 301 /web/gallery.html; }
    location = /snap-v2.json {
        types { } default_type application/vnd.farcaster.snap+json;
        try_files $uri =404;
    }
    location ~ \.md$ {
        types { } default_type "text/plain; charset=utf-8";
        expires 5m;
        try_files $uri =404;
    }
    location ~ (^|/)\. { return 404; }
    location = /.well-known/farcaster.json {
        types { } default_type application/json;
        try_files $uri =404;
    }
    # The operator surface belongs only on tinyfrens.miono.live.
    location ~ ^/(admin|api/admin)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
