services:
  relay:
    image: ${TINYFRENS_SERVER_IMAGE:-tinyfrens-server:local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/tinyfrens.db
      ALLOWED_ORIGINS: https://tinyfrens.lol,https://www.tinyfrens.lol
      ALLOW_NATIVE_ORIGIN: "true"
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      GEMINI_MODEL: gemini-2.0-flash
      BANKR_API_KEY: ${BANKR_API_KEY:-}
    volumes:
      - pets:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
  relay-rollback:
    image: ${TINYFRENS_ROLLBACK_IMAGE:-tinyfrens-server-python:rollback}
    profiles: ["rollback"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/tinyfrens.db
      ALLOWED_ORIGINS: https://tinyfrens.lol,https://www.tinyfrens.lol
      ALLOW_NATIVE_ORIGIN: "true"
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
    volumes:
      - pets:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PET_DOMAIN: ${PET_DOMAIN:?Set PET_DOMAIN in .env}
      RELAY_UPSTREAM: ${RELAY_UPSTREAM:-relay:8080}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pets:
  caddy_data:
  caddy_config:
