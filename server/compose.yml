services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/tinyfrens.db
      ALLOWED_ORIGINS: https://tinyfrens.lol,https://www.tinyfrens.lol,https://tinyfrens.vercel.app
      ALLOW_NATIVE_ORIGIN: "true"
      TRUST_PROXY: "true"
      HOST: 0.0.0.0
      GEMINI_MODEL: gemini-2.0-flash
      BANKR_API_KEY: ${BANKR_API_KEY:-}
    volumes:
      - pets:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PET_DOMAIN: ${PET_DOMAIN:?Set PET_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pets:
  caddy_data:
  caddy_config:
