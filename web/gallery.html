<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TinyFrens — Collection</title>
<meta name="theme-color" content="#17142a" />
<style>
  :root { --bg:#17142a; --panel:#211c39; --ink:#f3eeff; --muted:#a99fc7; --accent:#a474f1; --gold:#ffd700; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -10%, #2b2350, var(--bg)); color:var(--ink);
         font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; }
  header { position:sticky; top:0; backdrop-filter:blur(8px); background:rgba(23,20,42,.82);
           border-bottom:1px solid rgba(255,255,255,.07); padding:14px 18px; z-index:5; }
  h1 { margin:0; font-size:20px; letter-spacing:.2px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  input[type=text] { flex:1 1 320px; min-width:220px; padding:9px 12px; border-radius:10px;
                     border:1px solid rgba(255,255,255,.14); background:#120f22; color:var(--ink); font-family:ui-monospace,monospace; font-size:13px; }
  button { padding:9px 14px; border-radius:10px; border:0; background:var(--accent); color:#1a1030; font-weight:700; cursor:pointer; }
  button.secondary { background:rgba(255,255,255,.1); color:var(--ink); }
  button:disabled { opacity:.55; cursor:progress; }
  .stat { margin-left:auto; color:var(--muted); font-size:13px; }
  .bar { height:4px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  .bar.on { display:block; } .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .2s; }
  main { padding:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; max-width:1400px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:8px; cursor:pointer;
          transition:transform .12s ease, border-color .12s; position:relative; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .card.minted { border-color:rgba(255,215,0,.55); box-shadow:0 0 0 1px rgba(255,215,0,.25) inset; }
  .card svg { width:100%; height:auto; display:block; border-radius:8px; }
  .card .id { font-size:11px; color:var(--muted); text-align:center; margin-top:6px; }
  .card .badge { position:absolute; top:6px; right:6px; font-size:9px; background:var(--gold); color:#3a2a00;
                 padding:2px 6px; border-radius:999px; font-weight:800; display:none; }
  .card.minted .badge { display:block; }
  .modal { position:fixed; inset:0; background:rgba(10,8,20,.86); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .modal.on { display:flex; }
  .modal .box { background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:18px; max-width:420px; width:100%; padding:20px; }
  .modal svg, .modal img { width:100%; max-width:260px; margin:0 auto 14px; display:block; border-radius:12px; }
  .modal h2 { margin:0 0 4px; font-size:18px; }
  .traits { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
  .tag { font-size:12px; background:rgba(164,116,241,.16); border:1px solid rgba(164,116,241,.4); padding:3px 9px; border-radius:999px; }
  a.link { color:var(--accent); text-decoration:none; font-size:13px; }
  a.link:hover { text-decoration:underline; }
  .note { color:var(--muted); font-size:12px; margin:10px auto 0; max-width:1400px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:26px 16px; }
</style>
</head>
<body>
<header>
  <h1>Tiny<span>Frens</span> Collection <small style="color:var(--muted);font-size:12px;font-weight:400">· 888 on-chain companions</small></h1>
  <div class="sub">100% on-chain generative art. Previews render client-side; "Load on-chain" reads the real tokenURI from the deployed collection.</div>
  <div class="controls">
    <input type="text" id="nftAddr" placeholder="0x collection address (Base Sepolia)" spellcheck="false" />
    <button id="loadBtn" class="secondary">Load on-chain</button>
    <button id="previewBtn" class="secondary">Preview all 888</button>
    <span class="stat" id="stat">preview</span>
  </div>
  <div class="bar" id="bar"><i></i></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <p class="note" id="log"></p>
</main>
<div class="modal" id="modal">
  <div class="box">
    <div id="modalArt"></div>
    <h2 id="modalTitle">TinyFren</h2>
    <div id="modalSub" class="sub"></div>
    <div class="traits" id="modalTraits"></div>
    <div id="modalLinks"></div>
    <button class="secondary" id="closeModal">Close</button>
  </div>
</div>
<footer>Little by little. Day by day.</footer>
<script src="social-config.js"></script>
<script src="gallery.js"></script>
</body>
</html>
