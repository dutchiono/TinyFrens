<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17142a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><title>TinyFrens — your pocket pet</title><link rel="stylesheet" href="style.css"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TinyFrens"></head><body>
<main><header><span class="eyebrow">YOUR POCKET COMPANION</span><h1>TinyFrens <span>✦</span></h1><p>A tiny friend for your whole screen.</p></header>
<section class="pet-card"><div class="stars">✧ · ✦ · ✧</div><div class="pet-stage" id="stage" aria-label="Your animated pixel pet"><div id="pet" class="pet"><div class="ear left"></div><div class="ear right"></div><div class="body"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></div><div class="foot l"></div><div class="foot r"></div></div></div><div class="stage-label" id="stageText">Hatchling</div><div id="mood">Your familiar is curious.</div></section>
<section class="stats"><div><label>Fullness <b id="hungerText">80</b></label><progress id="hunger" max="100" value="80"></progress></div><div><label>Happiness <b id="happinessText">80</b></label><progress id="happiness" max="100" value="80"></progress></div><div><label>Energy <b id="energyText">80</b></label><progress id="energy" max="100" value="80"></progress></div></section>
<section class="actions"><button id="feed">🍓 Feed</button><button id="play">🎾 Play</button><button id="rest">🌙 Rest</button></section>
<section class="overlay"><h2>Floating companion</h2><p id="platform"></p><div class="actions"><button id="start">Show pet</button><button id="stop" class="secondary">Hide pet</button></div><div class="modes"><button data-mode="roam">Free roam</button><button data-mode="bubble">Bubble</button></div><p id="message" role="status"></p></section>
<section class="overlay" id="updates" hidden><h2>App updates</h2><label for="updateRepo">Public GitHub repository</label><input id="updateRepo" placeholder="owner/repo" autocapitalize="none" spellcheck="false"><div class="actions"><button id="checkUpdate">Check for updates</button><button id="downloadUpdate" hidden>Download update</button></div><p id="updateStatus" role="status"></p></section>
<footer><span id="age"></span> · Offline-first · No account</footer></main><script src="app.js"></script><script src="customize.js"></script><script src="pip.js"></script></body></html>
