name: TinyFrens
options:
  bundleIdPrefix: online.ionoi
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.8.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  TinyFrens:
    type: application
    platform: iOS
    sources:
      - path: TinyFrens
      - path: ../web
        type: folder
        buildPhase: resources
    dependencies:
      - target: TinyFrensWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.ionoi.tinyfrens
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tinyfrens]
        CFBundleDisplayName: TinyFrens
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        UIBackgroundModes: [audio]
  TinyFrensWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TinyFrensWidget
      - path: ../web/pets/mascot-robot.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.ionoi.tinyfrens.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: TinyFrens
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  TinyFrens:
    build:
      targets:
        TinyFrens: all
