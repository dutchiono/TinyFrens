<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" shape-rendering="crispEdges" data-species="0"><style>:root{--cloud:8s;--stars:4s;--leaves:10s;--sway:6s;--light:8s;--glow:7s;--depth:12s;--float:6s}.body{animation:bob 1.1294s steps(1) infinite}.foot-a{animation:step-a 1.1294s steps(1) infinite}.foot-b{animation:step-a 1.1294s steps(1) infinite;animation-delay:-0.5647s}.arm-a{animation:arm-a 1.1294s steps(1) infinite}.arm-b{animation:arm-a 1.1294s steps(1) infinite;animation-delay:-0.5647s}@keyframes bob{0%,50%,100%{transform:translateY(0)}12.5%,37.5%,62.5%,87.5%{transform:translateY(-1px)}25%,75%{transform:translateY(0)}}@keyframes step-a{0%,100%{transform:translate(-1px,0)}12.5%{transform:translate(0,-1px)}25%{transform:translate(1px,-2px)}37.5%{transform:translate(2px,-1px)}50%{transform:translate(2px,0)}62.5%{transform:translate(1px,0)}75%{transform:translate(0,0)}87.5%{transform:translate(-1px,0)}}@keyframes arm-a{0%,100%{transform:translate(1px,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(-1px,0)}75%{transform:translate(1px,-1px)}}.orb,.halo{animation:hover var(--float) steps(4) infinite alternate}@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-2px)}}.parallax{animation:parallax var(--depth) steps(4) infinite alternate}.light{animation:lighting var(--light) steps(4) infinite alternate}.sheen{animation:shade var(--light) steps(4) infinite alternate}.drift{animation:breeze var(--cloud) steps(10) infinite alternate}.twinkle{animation:sparkle var(--stars) steps(8) infinite alternate}.glow{animation:glimmer var(--glow) steps(4) infinite alternate}.sway{animation:sway var(--sway) steps(4) infinite alternate}.leaf{animation:fall var(--leaves) steps(14) infinite}.shadow{animation:shade var(--light) steps(6) infinite alternate}.late{animation-delay:-7s}@keyframes parallax{from{transform:translateX(-1px)}to{transform:translateX(1px)}}@keyframes lighting{from{opacity:.02}to{opacity:.18}}@keyfram