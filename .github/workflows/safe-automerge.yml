name: Enable owner PR auto-merge
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: owner-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dutchiono' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request native GitHub auto-merge for the current owner PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # The PR's contents are never checked out or executed in this privileged workflow.
          # Re-read current state: a draft/hold change may have followed the triggering event.
          pr=$(gh api "repos/$REPO/pulls/$PR")
          if ! jq -e --arg repo "$REPO" '.state == "open" and .user.login == "dutchiono" and .head.repo.full_name == $repo and .base.ref == "main"' <<< "$pr" >/dev/null; then
            exit 0
          fi
          if jq -e '.draft or any(.labels[]; .name == "hold-merge")' <<< "$pr" >/dev/null; then
            if jq -e '.auto_merge != null' <<< "$pr" >/dev/null; then
              gh pr merge "$PR" --repo "$REPO" --disable-auto
            fi
            exit 0
          fi
          sha=$(jq -r '.head.sha' <<< "$pr")
          # Owner-authorized for every path. GitHub still enforces all required checks.
          gh pr merge "$PR" --repo "$REPO" --squash --auto --match-head-commit "$sha"

          # A merge performed with GITHUB_TOKEN does not emit a usable push event for
          # downstream workflows. Wait for GitHub's native auto-merge to finish, then
          # explicitly dispatch both production workflows on the resulting main branch.
          for attempt in $(seq 1 120); do
            pr=$(gh api "repos/$REPO/pulls/$PR")
            if jq -e '.state == "closed" and .merged == true' <<< "$pr" >/dev/null; then
              gh workflow run publish-server.yml --repo "$REPO" --ref main
              gh workflow run deploy-backend.yml --repo "$REPO" --ref main
              exit 0
            fi
            if ! jq -e '.state == "open" and (.draft | not) and (any(.labels[]; .name == "hold-merge") | not)' <<< "$pr" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for native auto-merge" >&2
          exit 1
