name: Welcome site
on:
  push:
    branches: [main]
    paths: ['index.html', '.nojekyll', 'play/**', 'site/**', 'web/**', 'skills/tinyfrens-connect/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare welcome site and pet
        run: |
          mkdir -p public/site public/web public/play public/import
          cp index.html public/index.html
          cp -R site/. public/site/
          cp -R web/. public/web/
          cp -R play/. public/play/
          cp skills/tinyfrens-connect/SKILL.md public/skill.md
          cp skills/tinyfrens-connect/SKILL.md public/import/skill.md
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
