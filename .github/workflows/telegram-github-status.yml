name: Notify Telegram of GitHub results
on:
  workflow_run:
    workflows:
      - TinyFrens quality gate
      - Android APK
      - Desktop floating pet
      - iOS build
      - Friends relay checks
      - Deploy backend to server
      - Publish website to server
      - Enable owner PR auto-merge
      - Update production server configuration
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production-backend
    steps:
      - name: Report completed GitHub workflow to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_GITHUB_CHAT_ID }}
          EVENT_JSON: ${{ toJSON(github.event.workflow_run) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BOT_TOKEN" || -z "$CHAT_ID" ]]; then
            echo 'Configure TELEGRAM_BOT_TOKEN secret and TELEGRAM_GITHUB_CHAT_ID variable in production-backend environment' >&2
            exit 1
          fi
          name=$(jq -r '.name // "Workflow"' <<<"$EVENT_JSON")
          result=$(jq -r '.conclusion // "unknown"' <<<"$EVENT_JSON")
          branch=$(jq -r '.head_branch // "unknown"' <<<"$EVENT_JSON")
          sha=$(jq -r '(.head_sha // "")[0:8]' <<<"$EVENT_JSON")
          url=$(jq -r '.html_url // ""' <<<"$EVENT_JSON")
          case "$result" in
            failure) label='❌ FAILED' ;;
            cancelled) label='⚪ CANCELLED' ;;
            timed_out) label='⏱ TIMEOUT' ;;
            *) label="⚠️ ${result^^}" ;;
          esac
          printf -v message '%s — %s\nBranch: %s\nCommit: %s\n%s' \
            "$label" "$name" "$branch" "$sha" "$url"
          curl --fail-with-body --silent --show-error --max-time 15 \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$message" \
            --data-urlencode 'disable_web_page_preview=true' >/dev/null
          echo 'Telegram failure alert delivered'
