name: Publish website to server
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Native auto-merges requested with GITHUB_TOKEN can suppress push workflows.
  # Reconcile main periodically too; unchanged releases skip building/publishing.
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: publish-production-website
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-website
      url: https://tinyfrens.lol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Check whether main needs publishing
        id: needed
        run: node scripts/check-web-publish.mjs
      - name: Build public artifact
        if: steps.needed.outputs.publish == 'true'
        run: node scripts/build-site.mjs
      - name: Package website
        if: steps.needed.outputs.publish == 'true'
        run: tar -czf "$RUNNER_TEMP/website.tar.gz" -C dist .
      - name: Check that this is still the latest main revision
        if: steps.needed.outputs.publish == 'true'
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish through restricted SSH account
        if: steps.current.outputs.publish == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.TF_WEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TF_WEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/web-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/web-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/web-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/web-ssh/key"
          trap 'rm -f "$RUNNER_TEMP/web-ssh/key"' EXIT
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/web-ssh/known_hosts" \
            -i "$RUNNER_TEMP/web-ssh/key" tinyfrens-deploy@198.71.54.203 \
            "publish $GITHUB_SHA" < "$RUNNER_TEMP/website.tar.gz"
      - name: Verify public origin
        if: steps.current.outputs.publish == 'true'
        run: node scripts/verify-web-hosting.mjs --address 198.71.54.203
      - name: Notify owner after verified publish
        if: steps.current.outputs.publish == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.TF_WEB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TF_WEB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/web-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/web-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/web-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/web-ssh/key"
          trap 'rm -f "$RUNNER_TEMP/web-ssh/key"' EXIT
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/web-ssh/known_hosts" \
            -i "$RUNNER_TEMP/web-ssh/key" tinyfrens-deploy@198.71.54.203 \
            "notify $GITHUB_SHA"
