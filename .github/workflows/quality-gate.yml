name: TinyFrens quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run prepare-assets
      - name: Check renderer JavaScript syntax
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Native renderer and overlay smoke test
        run: xvfb-run --auto-servernum npx electron . --tinyfrens-smoke
        timeout-minutes: 3
