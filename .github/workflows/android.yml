name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: gradle :android:app:testDebugUnitTest :android:app:assembleDebug -PupdateRepo=dutchiono/TinyFrens
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-familiar-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare release signing
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.PET_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'Test APK built. Configure the four PET signing secrets in GITHUB_SETUP.md to enable installable updates.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pet-release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed update
        if: steps.signing.outputs.ready == 'true'
        env:
          PET_KEYSTORE_PATH: ${{ runner.temp }}/pet-release.jks
          PET_STORE_PASSWORD: ${{ secrets.PET_STORE_PASSWORD }}
          PET_KEY_ALIAS: ${{ secrets.PET_KEY_ALIAS }}
          PET_KEY_PASSWORD: ${{ secrets.PET_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          export PET_STORE_PASSWORD="$(python3 -c 'import os; print(os.environ["PET_STORE_PASSWORD"].strip(), end="")')"
          export PET_KEY_ALIAS="$(python3 -c 'import os; print(os.environ["PET_KEY_ALIAS"].strip(), end="")')"
          export PET_KEY_PASSWORD="$(python3 -c 'import os; print(os.environ["PET_KEY_PASSWORD"].strip(), end="")')"
          if ! keytool -list -keystore "$PET_KEYSTORE_PATH" -storepass:env PET_STORE_PASSWORD -alias "$PET_KEY_ALIAS" >/dev/null 2>&1; then
            echo '::error::Signing secrets do not match the keystore. Re-enter PET_STORE_PASSWORD and PET_KEY_ALIAS from the private signing file; paste values only.'
            exit 1
          fi
          code=$((1000 + RUN_NUMBER))
          version="0.5.$RUN_NUMBER"
          gradle :android:app:assembleRelease "-PpetVersionCode=$code" "-PpetVersionName=$version" -PupdateRepo=dutchiono/TinyFrens
          cp android/app/build/outputs/apk/release/app-release.apk pocket-familiar.apk
          checksum=$(sha256sum pocket-familiar.apk | cut -d ' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' "$code" "$version" "$checksum" > update.json
      - name: Publish APK release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="build-$RUN_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This build is already published; leaving its APK unchanged.'
          else
            gh release create "$tag" pocket-familiar.apk update.json --target "$GITHUB_SHA" --title "Pocket Familiar 0.5.$RUN_NUMBER" --notes 'Install pocket-familiar.apk to update. Your existing pet data is retained when updating a release signed with the same key.' --latest
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pet-release.jks"
