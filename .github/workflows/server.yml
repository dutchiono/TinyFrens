name: Friends relay checks
on:
  # Automatic server tests and JS syntax checks already run in quality-gate.yml.
  # Keep this standalone diagnostic available without duplicating every PR run.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --check web/friends.js && node --check web/customize.js
