name: Friends relay checks
on:
  push:
    paths: ['server/**', '.github/workflows/server.yml', 'web/friends.js', 'web/customize.js']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml', 'web/friends.js', 'web/customize.js']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/friends.js && node --check web/customize.js
